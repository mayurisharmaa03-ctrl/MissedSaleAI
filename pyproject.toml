[project]
name = "missedsale-ai"
version = "2.0.0"
description = "MissedSale AI – Intelligent Lost-Sales Detection & Recovery Platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "resend>=2.0.0",
    "joblib>=1.3.0",
    "psycopg2-binary>=2.9.9",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "MissedSaleAI.app:app"

[tool.pytest.ini_options]
norecursedirs = ["agent", "config"]
