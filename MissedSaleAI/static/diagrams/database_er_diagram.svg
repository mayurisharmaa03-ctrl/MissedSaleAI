<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background:#0b1120; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="crow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="50" y="25" width="1100" height="70" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="80" y="60" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">MissedSale AI – PostgreSQL Entity-Relationship (ER) Diagram</text>
  <text x="80" y="80" fill="#94a3b8" font-size="13">Relational Data Architecture, Audit Traces &amp; Persistent Agent Memory Tables</text>
  <rect x="990" y="42" width="135" height="34" rx="17" fill="#0284c7" />
  <text x="1057" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">ER SCHEMA</text>

  <!-- Table 1: customers (Central) -->
  <rect x="50" y="130" width="260" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
  <rect x="50" y="130" width="260" height="36" rx="10" fill="#0284c7" />
  <text x="180" y="154" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">customers</text>
  <text x="65" y="186" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="65" y="206" fill="#cbd5e1" font-size="11">    name : VARCHAR(120)</text>
  <text x="65" y="226" fill="#cbd5e1" font-size="11">    email : VARCHAR(120) [UNIQUE]</text>
  <text x="65" y="246" fill="#cbd5e1" font-size="11">    phone : VARCHAR(30)</text>
  <text x="65" y="266" fill="#cbd5e1" font-size="11">    customer_value : VARCHAR(20)</text>
  <text x="65" y="286" fill="#34d399" font-size="11">    email_opt_out : BOOLEAN</text>
  <text x="65" y="306" fill="#34d399" font-size="11">    last_email_sent : TIMESTAMP</text>
  <text x="65" y="326" fill="#34d399" font-size="11">    email_count : INTEGER</text>
  <text x="65" y="346" fill="#94a3b8" font-size="11">    created_at : TIMESTAMP</text>

  <!-- Table 2: products -->
  <rect x="910" y="130" width="240" height="175" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="910" y="130" width="240" height="36" rx="10" fill="#2563eb" />
  <text x="1030" y="154" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">products</text>
  <text x="925" y="186" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="925" y="206" fill="#cbd5e1" font-size="11">    name : VARCHAR(150)</text>
  <text x="925" y="226" fill="#cbd5e1" font-size="11">    category : VARCHAR(80)</text>
  <text x="925" y="246" fill="#cbd5e1" font-size="11">    price : NUMERIC(10,2) [₹]</text>
  <text x="925" y="266" fill="#cbd5e1" font-size="11">    stock : INTEGER</text>
  <text x="925" y="286" fill="#94a3b8" font-size="11">    created_at : TIMESTAMP</text>

  <!-- Table 3: sales (Order ledger) -->
  <rect x="520" y="130" width="270" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="520" y="130" width="270" height="36" rx="10" fill="#059669" />
  <text x="655" y="154" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">sales</text>
  <text x="535" y="186" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="535" y="206" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="535" y="226" fill="#60a5fa" font-size="11" font-weight="600">FK  product_id ➔ products(id)</text>
  <text x="535" y="246" fill="#cbd5e1" font-size="11">    amount : NUMERIC(10,2)</text>
  <text x="535" y="266" fill="#cbd5e1" font-size="11">    status : VARCHAR(30)</text>
  <text x="535" y="286" fill="#94a3b8" font-size="11">    sale_date : TIMESTAMP</text>

  <!-- Table 4: customer_behavior -->
  <rect x="50" y="400" width="270" height="215" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="400" width="270" height="36" rx="10" fill="#d97706" />
  <text x="185" y="424" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">customer_behavior</text>
  <text x="65" y="456" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="65" y="476" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="65" y="496" fill="#60a5fa" font-size="11" font-weight="600">FK  product_id ➔ products(id)</text>
  <text x="65" y="516" fill="#cbd5e1" font-size="11">    page_views : INTEGER</text>
  <text x="65" y="536" fill="#cbd5e1" font-size="11">    cart_added : INTEGER</text>
  <text x="65" y="556" fill="#cbd5e1" font-size="11">    checkout_started : BOOLEAN</text>
  <text x="65" y="576" fill="#cbd5e1" font-size="11">    session_duration : NUMERIC</text>
  <text x="65" y="596" fill="#94a3b8" font-size="11">    last_activity : TIMESTAMP</text>

  <!-- Table 5: lost_sales -->
  <rect x="420" y="400" width="280" height="175" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="420" y="400" width="280" height="36" rx="10" fill="#e11d48" />
  <text x="560" y="424" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">lost_sales</text>
  <text x="435" y="456" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="435" y="476" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="435" y="496" fill="#60a5fa" font-size="11" font-weight="600">FK  product_id ➔ products(id)</text>
  <text x="435" y="516" fill="#cbd5e1" font-size="11">    lost_probability : NUMERIC</text>
  <text x="435" y="536" fill="#cbd5e1" font-size="11">    status : VARCHAR(30)</text>
  <text x="435" y="556" fill="#94a3b8" font-size="11">    detected_at : TIMESTAMP</text>

  <!-- Table 6: recovery_opportunities -->
  <rect x="800" y="400" width="350" height="235" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)" />
  <rect x="800" y="400" width="350" height="36" rx="10" fill="#7c3aed" />
  <text x="975" y="424" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">recovery_opportunities</text>
  <text x="815" y="456" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="815" y="476" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="815" y="496" fill="#60a5fa" font-size="11" font-weight="600">FK  product_id ➔ products(id)</text>
  <text x="815" y="516" fill="#fb7185" font-size="11" font-weight="600">FK  lost_sale_id ➔ lost_sales(id)</text>
  <text x="815" y="536" fill="#cbd5e1" font-size="11">    recovery_probability : NUMERIC</text>
  <text x="815" y="556" fill="#cbd5e1" font-size="11">    priority : VARCHAR(20) [HIGH/MED/LOW]</text>
  <text x="815" y="576" fill="#cbd5e1" font-size="11">    recommended_action : VARCHAR(60)</text>
  <text x="815" y="596" fill="#a78bfa" font-size="11">    reasoning : TEXT [AI Rationale]</text>
  <text x="815" y="616" fill="#cbd5e1" font-size="11">    status : VARCHAR(30) [NEW/RECOVERED/...]</text>

  <!-- Table 7: communication_logs -->
  <rect x="800" y="675" width="350" height="215" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="800" y="675" width="350" height="36" rx="10" fill="#047857" />
  <text x="975" y="699" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">communication_logs</text>
  <text x="815" y="731" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="815" y="751" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="815" y="771" fill="#c084fc" font-size="11" font-weight="600">FK  opportunity_id ➔ recovery_opportunities(id)</text>
  <text x="815" y="791" fill="#cbd5e1" font-size="11">    recipient : VARCHAR(120)</text>
  <text x="815" y="811" fill="#cbd5e1" font-size="11">    subject : VARCHAR(255)</text>
  <text x="815" y="831" fill="#cbd5e1" font-size="11">    provider : VARCHAR(50) [Resend API]</text>
  <text x="815" y="851" fill="#cbd5e1" font-size="11">    resend_id : VARCHAR(100)</text>
  <text x="815" y="871" fill="#94a3b8" font-size="11">    sent_at : TIMESTAMP</text>

  <!-- Table 8: agent_actions -->
  <rect x="50" y="675" width="320" height="195" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="675" width="320" height="36" rx="10" fill="#7e22ce" />
  <text x="210" y="699" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">agent_actions (Agent Memory)</text>
  <text x="65" y="731" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="65" y="751" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="65" y="771" fill="#c084fc" font-size="11" font-weight="600">FK  opportunity_id ➔ recovery_opps(id)</text>
  <text x="65" y="791" fill="#cbd5e1" font-size="11">    action_type : VARCHAR(60)</text>
  <text x="65" y="811" fill="#cbd5e1" font-size="11">    reasoning : TEXT</text>
  <text x="65" y="831" fill="#cbd5e1" font-size="11">    result : TEXT</text>
  <text x="65" y="851" fill="#94a3b8" font-size="11">    created_at : TIMESTAMP</text>

  <!-- Table 9: agent_decisions -->
  <rect x="420" y="675" width="330" height="195" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="420" y="675" width="330" height="36" rx="10" fill="#be185d" />
  <text x="585" y="699" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">agent_decisions</text>
  <text x="435" y="731" fill="#fde047" font-size="11" font-weight="700">PK  id : INTEGER</text>
  <text x="435" y="751" fill="#38bdf8" font-size="11" font-weight="600">FK  customer_id ➔ customers(id)</text>
  <text x="435" y="771" fill="#cbd5e1" font-size="11">    decision : VARCHAR(60)</text>
  <text x="435" y="791" fill="#cbd5e1" font-size="11">    reasoning / rationale : TEXT</text>
  <text x="435" y="811" fill="#cbd5e1" font-size="11">    confidence : NUMERIC(4,3)</text>
  <text x="435" y="831" fill="#cbd5e1" font-size="11">    priority : VARCHAR(20)</text>
  <text x="435" y="851" fill="#94a3b8" font-size="11">    created_at : TIMESTAMP</text>

  <!-- Relations -->
  <!-- customers to sales -->
  <path d="M 310 215 L 520 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- products to sales -->
  <path d="M 910 215 L 790 215" stroke="#60a5fa" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- customers to behavior -->
  <path d="M 180 360 L 180 400" stroke="#38bdf8" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- behavior to lost_sales -->
  <path d="M 320 485 L 420 485" stroke="#f59e0b" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- lost_sales to recovery_opportunities -->
  <path d="M 700 485 L 800 485" stroke="#f43f5e" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- recovery_opportunities to communication_logs -->
  <path d="M 975 635 L 975 675" stroke="#8b5cf6" stroke-width="2" marker-end="url(#crow-arrow)" />
  <!-- customers to agent_actions -->
  <path d="M 130 360 L 130 675" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#crow-arrow)" />
  <!-- customers to agent_decisions -->
  <path d="M 230 360 L 230 640 L 500 640 L 500 675" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#crow-arrow)" fill="none" />
</svg>
