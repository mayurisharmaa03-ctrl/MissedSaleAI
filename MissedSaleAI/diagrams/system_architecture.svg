<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#0b1120; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Header & Title Banner -->
  <rect x="40" y="25" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="70" y="60" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">MissedSale AI – Overall System Architecture</text>
  <text x="70" y="80" fill="#94a3b8" font-size="13">Enterprise Autonomous Sales Recovery &amp; Predictive CRM Platform</text>
  <rect x="1000" y="42" width="130" height="34" rx="17" fill="#0284c7" />
  <text x="1065" y="63" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">LUCID DIAGRAM</text>

  <!-- Swimlane 1: CLIENT & INTERACTION LAYER -->
  <rect x="40" y="120" width="240" height="660" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="40" y="120" width="240" height="42" rx="14" fill="#1e293b" />
  <text x="160" y="146" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">1. CLIENT &amp; TOUCHPOINTS</text>

  <!-- Customer Box -->
  <rect x="60" y="185" width="200" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="160" y="220" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Customer / Shopper</text>
  <text x="160" y="242" fill="#94a3b8" font-size="12" text-anchor="middle">Browsing • Carting • Drop-off</text>
  <text x="160" y="260" fill="#38bdf8" font-size="11" text-anchor="middle">Web &amp; Mobile Session</text>

  <!-- E-commerce Storefront Box -->
  <rect x="60" y="325" width="200" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#card-shadow)" />
  <text x="160" y="358" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Storefront Frontend</text>
  <text x="160" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">HTML5 / Bootstrap 5 / JS</text>
  <text x="160" y="398" fill="#64748b" font-size="11" text-anchor="middle">Product Catalog &amp; Cart Tracker</text>

  <!-- Internal CRM Portal Box -->
  <rect x="60" y="465" width="200" height="105" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="160" y="498" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Internal CRM Portal</text>
  <text x="160" y="520" fill="#a5b4fc" font-size="11" text-anchor="middle">Live Pipeline • 360° Profiles</text>
  <text x="160" y="538" fill="#94a3b8" font-size="11" text-anchor="middle">Agent Control &amp; Overrides</text>
  <text x="160" y="556" fill="#818cf8" font-size="11" text-anchor="middle">Chart.js Analytics Visuals</text>

  <!-- Customer Email Inbox Box -->
  <rect x="60" y="615" width="200" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="160" y="648" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Customer Email Inbox</text>
  <text x="160" y="670" fill="#6ee7b7" font-size="11" text-anchor="middle">Personalized Recovery Email</text>
  <text x="160" y="688" fill="#94a3b8" font-size="11" text-anchor="middle">1-Click Instant Cart Resume</text>

  <!-- Swimlane 2: BACKEND & DATABASE LAYER -->
  <rect x="310" y="120" width="280" height="660" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="310" y="120" width="280" height="42" rx="14" fill="#1e293b" />
  <text x="450" y="146" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">2. BACKEND &amp; DATA STORE</text>

  <!-- Flask Application Server Box -->
  <rect x="330" y="185" width="240" height="235" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="450" y="215" fill="#60a5fa" font-size="15" font-weight="700" text-anchor="middle">Flask REST Application</text>
  <rect x="345" y="235" width="210" height="28" rx="6" fill="#0f172a" />
  <text x="450" y="253" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Auth &amp; Session Management</text>
  <rect x="345" y="272" width="210" height="28" rx="6" fill="#0f172a" />
  <text x="450" y="290" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Behavior Tracking API (/api/...)</text>
  <rect x="345" y="309" width="210" height="28" rx="6" fill="#0f172a" />
  <text x="450" y="327" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Agentic Execution Controller</text>
  <rect x="345" y="346" width="210" height="28" rx="6" fill="#0f172a" />
  <text x="450" y="364" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Resend Webhook Receiver</text>
  <rect x="345" y="383" width="210" height="26" rx="6" fill="#0f172a" />
  <text x="450" y="400" fill="#94a3b8" font-size="10" text-anchor="middle">Analytics &amp; KPI Engine</text>

  <!-- PostgreSQL Database Box -->
  <rect x="330" y="465" width="240" height="235" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="450" y="495" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL Database</text>
  <text x="450" y="513" fill="#94a3b8" font-size="11" text-anchor="middle">Persistent State &amp; Agent Memory</text>
  <rect x="345" y="530" width="210" height="32" rx="6" fill="#0f172a" />
  <text x="450" y="550" fill="#e2e8f0" font-size="11" text-anchor="middle">customers • sales • products</text>
  <rect x="345" y="570" width="210" height="32" rx="6" fill="#0f172a" />
  <text x="450" y="590" fill="#e2e8f0" font-size="11" text-anchor="middle">customer_behavior • lost_sales</text>
  <rect x="345" y="610" width="210" height="32" rx="6" fill="#0f172a" />
  <text x="450" y="630" fill="#e2e8f0" font-size="11" text-anchor="middle">recovery_opportunities • campaigns</text>
  <rect x="345" y="650" width="210" height="32" rx="6" fill="#0f172a" />
  <text x="450" y="670" fill="#38bdf8" font-size="11" text-anchor="middle">agent_actions • agent_decisions</text>

  <!-- Swimlane 3: AI/ML & AGENT DECISION ENGINE -->
  <rect x="620" y="120" width="310" height="660" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="620" y="120" width="310" height="42" rx="14" fill="#1e293b" />
  <text x="775" y="146" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">3. AI / ML &amp; AGENT LOOP</text>

  <!-- ML Predictive Engine Box -->
  <rect x="640" y="185" width="270" height="175" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="775" y="215" fill="#fbbf24" font-size="15" font-weight="700" text-anchor="middle">Scikit-Learn ML Engine</text>
  <rect x="655" y="235" width="240" height="32" rx="6" fill="#0f172a" />
  <text x="775" y="255" fill="#fde68a" font-size="11" text-anchor="middle">Random Forest Champion (Acc: 80%)</text>
  <rect x="655" y="275" width="240" height="32" rx="6" fill="#0f172a" />
  <text x="775" y="295" fill="#cbd5e1" font-size="11" text-anchor="middle">Logistic Regression Baseline (Acc: 81%)</text>
  <rect x="655" y="315" width="240" height="32" rx="6" fill="#0f172a" />
  <text x="775" y="335" fill="#94a3b8" font-size="11" text-anchor="middle">Lost-Sale &amp; Recovery Probability</text>

  <!-- Autonomous Sales Recovery Agent Box -->
  <rect x="640" y="390" width="270" height="310" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#card-shadow)" />
  <text x="775" y="420" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">Sales Recovery Agent</text>
  <text x="775" y="438" fill="#94a3b8" font-size="11" text-anchor="middle">7-Stage Autonomous Decision Loop</text>
  
  <rect x="655" y="455" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="473" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">1. OBSERVE (Cart, Clicks, History)</text>
  <rect x="655" y="490" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="508" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">2. ANALYZE (ML Probabilities)</text>
  <rect x="655" y="525" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="543" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">3. REASON (CLV, Intent, Fatigue)</text>
  <rect x="655" y="560" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="578" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">4. DECIDE (High / Med / Low Priority)</text>
  <rect x="655" y="595" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="613" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">5. ACT (CRM Opp &amp; Resend API)</text>
  <rect x="655" y="630" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="648" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">6. MONITOR (Purchases &amp; Opens)</text>
  <rect x="655" y="665" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="775" y="683" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">7. ADAPT (Policy &amp; Fatigue Rules)</text>

  <!-- Swimlane 4: EXTERNAL SERVICES & INTEGRATIONS -->
  <rect x="960" y="120" width="200" height="660" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="960" y="120" width="200" height="42" rx="14" fill="#1e293b" />
  <text x="1060" y="146" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">4. TOOL SERVICES</text>

  <!-- Resend API Box -->
  <rect x="980" y="235" width="160" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="1060" y="265" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Resend API</text>
  <text x="1060" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">REST Email Engine</text>
  <text x="1060" y="306" fill="#cbd5e1" font-size="10" text-anchor="middle">DKIM / SPF Verified</text>
  <text x="1060" y="324" fill="#6ee7b7" font-size="10" text-anchor="middle">Fallback Demo Mode</text>

  <!-- Webhook Dispatcher Box -->
  <rect x="980" y="415" width="160" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1" filter="url(#card-shadow)" />
  <text x="1060" y="445" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">Event Webhooks</text>
  <text x="1060" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">email.delivered</text>
  <text x="1060" y="486" fill="#94a3b8" font-size="11" text-anchor="middle">email.opened</text>
  <text x="1060" y="504" fill="#94a3b8" font-size="11" text-anchor="middle">email.bounced</text>

  <!-- External CRM & Tool Registry -->
  <rect x="980" y="580" width="160" height="115" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1" filter="url(#card-shadow)" />
  <text x="1060" y="610" fill="#fb7185" font-size="14" font-weight="700" text-anchor="middle">Tool Registry</text>
  <text x="1060" y="632" fill="#94a3b8" font-size="11" text-anchor="middle">• DatabaseTool</text>
  <text x="1060" y="650" fill="#94a3b8" font-size="11" text-anchor="middle">• CRMTool</text>
  <text x="1060" y="668" fill="#94a3b8" font-size="11" text-anchor="middle">• EmailTool</text>

  <!-- Connectors & Directed Flows -->
  <!-- 1. Customer to Storefront -->
  <path d="M 160 280 L 160 325" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 2. Storefront to Flask -->
  <path d="M 260 372 L 330 300" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <!-- 3. Flask to DB -->
  <path d="M 450 420 L 450 465" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 4. Flask to ML -->
  <path d="M 570 270 L 640 270" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 5. ML to Agent -->
  <path d="M 775 360 L 775 390" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)" />
  <!-- 6. Agent to Tools -->
  <path d="M 910 610 L 980 610" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 7. Agent to Resend -->
  <path d="M 850 390 L 850 295 L 980 295" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none" />
  <!-- 8. Resend to Customer Inbox -->
  <path d="M 1060 235 L 1060 100 L 160 100 L 160 185" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-emerald)" fill="none" />
  <!-- 9. Resend to Webhook Receiver -->
  <path d="M 1060 355 L 1060 415" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 10. Webhook to Flask -->
  <path d="M 980 470 L 570 360" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <!-- 11. Customer Inbox to Storefront -->
  <path d="M 160 615 L 160 570 L 160 420" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />
</svg>
